# Cross-platform build matrix.
#
# EXPECTED TO FAIL until BACKLOG C7 is done. Until the carve-out completes,
# TIDE depends on EditorLib, which lives in the private SynthEdit repo, so a
# clean checkout genuinely cannot build. That failure is the point: when this
# workflow goes green from a clean clone with no private access, the project is
# actually open source. Do not add a private deploy key to "fix" it — that
# would hide the very thing we are measuring.
#
# BACKLOG B1: get this failing for exactly that one honest reason, rather than
# for toolchain or syntax errors.
#
# BACKLOG A5 (2026-08-09) fixed the issue-filing step below, which had never
# executed once. The other half of that diagnosis -- `continue-on-error` at job
# level, which made every run report success regardless -- is fixed as of
# 2026-08-20. So when this matrix runs, its result now means something. It does
# not run yet: see the guard job below.
#
# 2026-08-16: the matrix is now gated on the `guard` job below, because until
# C7 lands there is no root CMakeLists.txt and all three platforms died at
# Configure — putting six FAILURE rows on every PR. Nothing gated on them (this
# repo has no branch protection and no required status checks, and auto-merge
# reads `lint`, not this), so their only effect was to train everyone to skim
# past `gh pr checks` entirely. A check list that is always red measures
# nothing, exactly like a run that always reports success.
#
# The gate deliberately skips rather than fakes a pass: a skipped matrix says
# "not attempted", where a green one would claim a clean-clone build succeeded.
# It is keyed on the file itself, like the issue-filing suppression below, so
# the moment C7 adds a root CMakeLists.txt the matrix starts running again with
# nobody having to remember to remove anything. This does NOT close B1 — after
# 2026-08-20 dropped the `continue-on-error` below, what B1 still owns is
# authoring TIDE's root CMakeLists.txt, which is C7d's job.

name: build

on:
  push:
    branches: ["main", "tide/**"]
  pull_request:
  workflow_dispatch:

# A push to a `tide/**` branch with an open PR fires this twice, and both runs
# are load-bearing: the `pull_request` run is the check a PR shows (and what
# A4's auto-merge tier will gate on), while only the `push` run can file a
# platform issue — the step below is gated on `github.event_name == 'push'`.
# So the duplication stays; this only drops runs that a newer push has already
# superseded.
#
# `github.event_name` is in the key on purpose. Without it, push and PR share a
# group and the PR run cancels the push run — a cancelled run reports
# `cancelled`, not `failure`, so `failure()` is false and the issue never gets
# filed. That would silently kill the mechanism A5 exists to provide, and it
# would look exactly like the 403 did: nothing in the feed, nothing to see.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is there anything to build yet? Pre-C7 there is not, and the three matrix
  # jobs would each spend their setup time only to die at Configure.
  #
  # This is a separate job rather than a step-level `if:` on Configure/Build
  # because a matrix job that runs and skips its own steps reports SUCCESS,
  # which is the one outcome this file must never produce dishonestly.
  guard:
    name: guard
    # BACKLOG S29 -- ONE RUN PER COMMIT.
    #
    # This workflow triggers on `push: ["main", "tide/**"]` AND on
    # `pull_request:`, so a same-repo branch with a PR fired the whole
    # three-platform matrix TWICE on the same sha. Measured 2026-08-21 on
    # tide/mac/macos-arm64: four shas, eight runs, each a push/pull_request
    # pair about four seconds apart.
    #
    # The concurrency block below does NOT catch this, and it is worth knowing
    # why before anyone "simplifies" it: its group keys on `github.ref`, which
    # is `refs/heads/<branch>` for push and `refs/pull/<n>/merge` for
    # pull_request. Different refs, different groups. Dropping `event_name`
    # from that key -- the obvious fix, and the one BACKLOG S29 originally
    # recommended -- changes nothing for exactly this reason.
    #
    # So the duplicate is prevented here instead: run on push, and on
    # pull_request ONLY when the PR comes from a fork, where no push event
    # reaches this repo. Same-repo PRs are already covered by their push run,
    # whose checks attach to the same sha and therefore appear on the PR.
    #
    # Chosen over a sha-based concurrency group deliberately. That would let
    # both runs QUEUE and then cancel one -- and on this repo the scarce
    # resource is the macOS runner (S30: ~5% of runs complete), so a run that
    # queues and dies has already taken the slot. This never starts it.
    #
    # THE COST, stated: same-repo PRs are no longer tested as a merge result,
    # only as the branch tip. Acceptable while this repo squash-merges quickly;
    # revisit if main starts moving under long-lived PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
    steps:
      # No submodules: this only needs to know whether one file exists at the
      # root, and recursive submodule fetch is most of a checkout's cost.
      - uses: actions/checkout@v7

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f CMakeLists.txt ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Root CMakeLists.txt present — running the build matrix."
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root CMakeLists.txt yet (BACKLOG C7) — skipping the build matrix. This is the known pre-C7 state, not a regression."
          fi

  build:
    name: ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.buildable == 'true'
    runs-on: ${{ matrix.os }}

    # `continue-on-error: true` was here from this file's first commit, and it
    # made the whole matrix decorative: every run reported success whatever the
    # compiler said. Removed 2026-08-20 (interactive, Jeff directing), B1's
    # remaining half apart from the CMake itself.
    #
    # Removing it BEFORE C7d is deliberate and is not a red-checks window: the
    # `if:` above skips this job entirely until a root CMakeLists.txt exists, so
    # the change is inert until the day it is wanted, and nobody has to remember
    # it then. `fail-fast: false` stays, so one platform going red still lets the
    # other two report and still lets each file its own platform issue.

    # Scoped to this job on purpose. The repo-wide default is `read`, which is
    # why the issue step below silently 403'd for its entire existence, and the
    # tempting one-line fix — flipping the repository default to `write` — would
    # hand write access to every workflow in the repo. That directly undercuts
    # BACKLOG A1, which just finished pulling credentials out of casual reach.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: win
          - name: macos
            os: macos-latest
            platform: mac
          - name: linux
            os: ubuntu-latest
            platform: linux

    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 anyway
      # while printing a deprecation warning on every job. v5 is the Node 24
      # rebuild; v6 writes the token to a separate credential file; v7 blocks
      # checking out a fork PR head under `pull_request_target`/`workflow_run`,
      # neither of which this workflow uses. Nothing here reads the persisted
      # credential or checks out a fork head, so the jump is behaviour-neutral.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # The four on the LAST line are what C7e waited on.
          # GMPI_Wrappers/wrapper/VST3/CMakeLists.txt:256-264 runs six
          # pkg_check_modules(... REQUIRED) probes -- x11+xext, fontconfig,
          # freetype2, harfbuzz, libpng, dbus-1 -- and REQUIRED fails FAST, so
          # the log only ever named `xext` while harfbuzz and dbus-1 waited
          # behind it. The set was measured by restoring one .pc at a time on a
          # real Ubuntu box until configure returned 0, not read off the log:
          # docs/ci/linux-build-deps.md.
          #
          # libpng is in the probe list and passes today only because the
          # runner image happens to ship it -- declared here so it is one image
          # bump away from nothing rather than from a red build.
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxcb1-dev libgl1-mesa-dev libfreetype-dev \
            libfontconfig1-dev libasound2-dev \
            libxext-dev libharfbuzz-dev libdbus-1-dev libpng-dev

      - name: Configure
        id: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        id: build
        run: cmake --build build --config Release --parallel

      # A failing build on mac or linux is only useful if the machine that owns
      # that platform finds out about it. See docs/agent-setup.md, which calls
      # this "the mechanism the whole arrangement exists for".
      #
      # It had never once executed. From the day it was written until
      # 2026-08-09 the job's GITHUB_TOKEN was read-only, so `gh issue create`
      # returned 403; the job-level continue-on-error then in force swallowed
      # that, the run
      # reported success, and zero issues were ever filed — while every weekly
      # run's STEP 1 dutifully polled a feed that could not fill. Verified
      # before fixing: `gh issue list --state all` was empty and the workflow
      # permission was `read`. Assert on the signal, not the exit code.
      - name: File a platform issue on failure
        if: failure() && matrix.platform != 'win' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_NAME: ${{ matrix.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Backstop. Since 2026-08-16 the `guard` job gates the whole matrix on
          # this same condition, so reaching here with no root CMakeLists.txt
          # should be impossible. Kept anyway: it is two lines, and it is what
          # stops the issue-filing floodgate reopening silently if the guard is
          # ever removed without this being reconsidered.
          #
          # The check is the file itself rather than a log string: when C7 adds
          # a root CMakeLists.txt the suppression lifts by itself, with nobody
          # having to remember to remove it. A grep for the cmake error message
          # would need maintaining and would break on a cmake wording change.
          if [ ! -f CMakeLists.txt ]; then
            echo "::notice::No root CMakeLists.txt — this is the known pre-C7 failure (BACKLOG C7), not filing an issue."
            exit 0
          fi

          TITLE="Build failure on ${PLATFORM_NAME} — ${BRANCH}"

          # One issue per branch+platform. Without this, every push to a branch
          # that is still broken files another duplicate, and STEP 1's feed
          # becomes noise the owning machine learns to skim past.
          EXISTING=$(gh issue list \
            --state open \
            --label "platform:${PLATFORM}" \
            --limit 100 \
            --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Open issue #${EXISTING} already covers this branch+platform — commenting instead of duplicating."
            gh issue comment "$EXISTING" --body "$(printf '%s\n' \
              "Still failing as of \`${GITHUB_SHA}\`." \
              "" \
              "Run: ${RUN_URL}")"
          else
            gh issue create \
              --title "$TITLE" \
              --label "platform:${PLATFORM}" \
              --body "$(printf '%s\n' \
                "Branch: \`${BRANCH}\`" \
                "Commit: \`${GITHUB_SHA}\`" \
                "Run: ${RUN_URL}" \
                "" \
                "The ${PLATFORM_NAME} machine's next weekly run should pick this up" \
                "before taking a backlog item (STEP 1). Full compiler output is in" \
                "the run log." \
                "" \
                "Close this only after verifying the fix by building on that" \
                "platform; otherwise leave it open and say what remains.")"
          fi
