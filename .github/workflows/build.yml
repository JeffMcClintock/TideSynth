# Cross-platform build matrix.
#
# EXPECTED TO FAIL until BACKLOG C7 is done. Until the carve-out completes,
# TIDE depends on EditorLib, which lives in the private SynthEdit repo, so a
# clean checkout genuinely cannot build. That failure is the point: when this
# workflow goes green from a clean clone with no private access, the project is
# actually open source. Do not add a private deploy key to "fix" it — that
# would hide the very thing we are measuring.
#
# BACKLOG B1: get this failing for exactly that one honest reason, rather than
# for toolchain or syntax errors.
#
# BACKLOG A5 (2026-08-09) fixed the issue-filing step below, which had never
# executed once. The other half of that diagnosis -- `continue-on-error` at job
# level, which made every run report success regardless -- is fixed as of
# 2026-08-20. So when this matrix runs, its result now means something. It does
# not run yet: see the guard job below.
#
# 2026-08-16: the matrix is now gated on the `guard` job below, because until
# C7 lands there is no root CMakeLists.txt and all three platforms died at
# Configure — putting six FAILURE rows on every PR. Nothing gated on them (this
# repo has no branch protection and no required status checks, and auto-merge
# reads `lint`, not this), so their only effect was to train everyone to skim
# past `gh pr checks` entirely. A check list that is always red measures
# nothing, exactly like a run that always reports success.
#
# The gate deliberately skips rather than fakes a pass: a skipped matrix says
# "not attempted", where a green one would claim a clean-clone build succeeded.
# It is keyed on the file itself, like the issue-filing suppression below, so
# the moment C7 adds a root CMakeLists.txt the matrix starts running again with
# nobody having to remember to remove anything. This does NOT close B1 — after
# 2026-08-20 dropped the `continue-on-error` below, what B1 still owns is
# authoring TIDE's root CMakeLists.txt, which is C7d's job.

name: build

on:
  push:
    branches: ["main", "tide/**"]
  pull_request:
  workflow_dispatch:

# A push to a `tide/**` branch with an open PR fires this twice, and both runs
# are load-bearing: the `pull_request` run is the check a PR shows (and what
# A4's auto-merge tier will gate on), while only the `push` run can file a
# platform issue — the step below is gated on `github.event_name == 'push'`.
# So the duplication stays; this only drops runs that a newer push has already
# superseded.
#
# `github.event_name` is in the key on purpose. Without it, push and PR share a
# group and the PR run cancels the push run — a cancelled run reports
# `cancelled`, not `failure`, so `failure()` is false and the issue never gets
# filed. That would silently kill the mechanism A5 exists to provide, and it
# would look exactly like the 403 did: nothing in the feed, nothing to see.
#
# S30, 2026-08-22: `cancel-in-progress` is now FALSE, and the reason is a
# measurement rather than a preference.
#
# macOS builds take ~60 minutes against linux 5 and windows 10 -- not because it
# does more (the same run compiled 495 objects on macOS and 496 on Windows) but
# because the runner is ~5x slower at the same work. A 60-minute job offers a
# 60-minute window for a newer push to kill it, and macOS was cancelled 17 of 28
# jobs (61%) against 14 of 56 (25%) for the other two. The practical effect was
# never knowing whether macOS passed.
#
# Cancelling is not free either way -- it was also destroying a quarter of the
# windows and linux runs, which cost 5-10 minutes each to redo.
#
# WHAT THIS DOES NOT DO IS PILE UP RUNS. GitHub keeps at most one PENDING run per
# group: a third arrival supersedes the second, so the group holds one running
# and one queued and the newest push always gets its turn. The cost is latency on
# a rapidly-pushed branch -- macOS results arrive later -- not an unbounded queue.
#
# Revisit if the ccache step below brings macOS near the other platforms; at
# 5-10 minutes a side, cancelling would be cheap again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Is there anything to build yet? Pre-C7 there is not, and the three matrix
  # jobs would each spend their setup time only to die at Configure.
  #
  # This is a separate job rather than a step-level `if:` on Configure/Build
  # because a matrix job that runs and skips its own steps reports SUCCESS,
  # which is the one outcome this file must never produce dishonestly.
  guard:
    name: guard
    # BACKLOG S29 -- ONE RUN PER COMMIT.
    #
    # This workflow triggers on `push: ["main", "tide/**"]` AND on
    # `pull_request:`, so a same-repo branch with a PR fired the whole
    # three-platform matrix TWICE on the same sha. Measured 2026-08-21 on
    # tide/mac/macos-arm64: four shas, eight runs, each a push/pull_request
    # pair about four seconds apart.
    #
    # The concurrency block below does NOT catch this, and it is worth knowing
    # why before anyone "simplifies" it: its group keys on `github.ref`, which
    # is `refs/heads/<branch>` for push and `refs/pull/<n>/merge` for
    # pull_request. Different refs, different groups. Dropping `event_name`
    # from that key -- the obvious fix, and the one BACKLOG S29 originally
    # recommended -- changes nothing for exactly this reason.
    #
    # So the duplicate is prevented here instead: run on push, and on
    # pull_request ONLY when the PR comes from a fork, where no push event
    # reaches this repo. Same-repo PRs are already covered by their push run,
    # whose checks attach to the same sha and therefore appear on the PR.
    #
    # Chosen over a sha-based concurrency group deliberately. That would let
    # both runs QUEUE and then cancel one -- and on this repo the scarce
    # resource is the macOS runner (S30: ~5% of runs complete), so a run that
    # queues and dies has already taken the slot. This never starts it.
    #
    # THE COST, stated: same-repo PRs are no longer tested as a merge result,
    # only as the branch tip. Acceptable while this repo squash-merges quickly;
    # revisit if main starts moving under long-lived PRs.
    # THE `tide/` TEST IS LOAD-BEARING, and the merged guard lacked it.
    # Skipping every same-repo PR assumes a push run already covered the
    # branch -- true only for `main` and `tide/**`, which is what `on: push:`
    # above lists. A branch outside that pattern gets NO push run, so skipping
    # its PR run too leaves it with ZERO build coverage. Jeff's own branches
    # are all outside it (`website-donate-link-wording`, `c7-linux-ci-deps`,
    # `s29-one-run-per-commit`), and the hole is silent by construction: a
    # skipped job reports green.
    #
    # Keep this condition in step with `on: push: branches:` above -- they are
    # two halves of one rule.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'tide/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
      mac_runner: ${{ steps.macrunner.outputs.labels }}
    steps:
      # No submodules: this only needs to know whether one file exists at the
      # root, and recursive submodule fetch is most of a checkout's cost.
      - uses: actions/checkout@v7

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f CMakeLists.txt ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Root CMakeLists.txt present — running the build matrix."
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root CMakeLists.txt yet (BACKLOG C7) — skipping the build matrix. This is the known pre-C7 state, not a regression."
          fi

      # SELF-HOSTED macOS. `tidesynth-m1` is the M1 in Jeff's office, registered
      # to this repo. Measured against the GitHub-hosted runner on the same
      # commit: Configure 16s against 57s, doing the identical cold dependency
      # fetch. That ratio, not the build step, is the whole gain here -- S30
      # already got Build down to ~23s with ccache.
      #
      # THIS REPO IS PUBLIC, and that is why the label set is computed here
      # instead of written literally into the matrix below. A self-hosted runner
      # executes whatever the job tells it to, on a machine that also holds the
      # private SE16 checkout, an SSH key, and a gh token with `repo` scope. A
      # fork PR must therefore never reach it: forks stay on GitHub's
      # macos-latest, which is disposable and holds nothing of Jeff's.
      #
      # A same-repo PR is trusted here for the same reason the `if:` above trusts
      # it -- its head is a branch in this repo, and only collaborators can push.
      #
      # BELT AND BRACES, because otherwise one careless edit to this file is the
      # entire defence. Repo Settings -> Actions is set to
      # `all_external_contributors` (REST: actions/permissions/
      # fork-pr-contributor-approval), so a fork PR needs a human click before
      # ANY runner picks it up. Two independent halves; keep both.
      - id: macrunner
        shell: bash
        env:
          # Via env rather than inlined into the `if` below: a fork's branch name
          # reaches this step as data, and interpolating it straight into a shell
          # test is how a branch named `$(...)` would get to run here.
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ]; then
            echo 'labels=["macos-latest"]' >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR — macOS stays on the GitHub-hosted runner."
          else
            echo 'labels=["self-hosted","macOS","ARM64","m1"]' >> "$GITHUB_OUTPUT"
            echo "::notice::macOS routed to the self-hosted runner tidesynth-m1."
          fi

  build:
    name: ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.buildable == 'true'
    # macOS is routed by the guard job above; windows and linux take matrix.os
    # unchanged. `matrix.os` stays populated for macOS on purpose -- it is what
    # the fork branch falls back to, and dropping it would make this line the
    # only record of which hosted image macOS ever used.
    #
    # The `|| '["macos-latest"]'` is not decoration: if `guard` is ever skipped
    # (its `if:` can skip it), `mac_runner` arrives as an empty string and bare
    # fromJSON('') is a hard workflow error rather than a skipped job. The `if:`
    # above should already prevent that -- this is what stops a future edit to
    # the guard's condition turning into an unparseable workflow instead.
    runs-on: ${{ matrix.name == 'macos' && fromJSON(needs.guard.outputs.mac_runner || '["macos-latest"]') || matrix.os }}

    # `continue-on-error: true` was here from this file's first commit, and it
    # made the whole matrix decorative: every run reported success whatever the
    # compiler said. Removed 2026-08-20 (interactive, Jeff directing), B1's
    # remaining half apart from the CMake itself.
    #
    # Removing it BEFORE C7d is deliberate and is not a red-checks window: the
    # `if:` above skips this job entirely until a root CMakeLists.txt exists, so
    # the change is inert until the day it is wanted, and nobody has to remember
    # it then. `fail-fast: false` stays, so one platform going red still lets the
    # other two report and still lets each file its own platform issue.

    # Scoped to this job on purpose. The repo-wide default is `read`, which is
    # why the issue step below silently 403'd for its entire existence, and the
    # tempting one-line fix — flipping the repository default to `write` — would
    # hand write access to every workflow in the repo. That directly undercuts
    # BACKLOG A1, which just finished pulling credentials out of casual reach.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: win
          - name: macos
            os: macos-latest
            platform: mac
          - name: linux
            os: ubuntu-latest
            platform: linux

    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 anyway
      # while printing a deprecation warning on every job. v5 is the Node 24
      # rebuild; v6 writes the token to a separate credential file; v7 blocks
      # checking out a fork PR head under `pull_request_target`/`workflow_run`,
      # neither of which this workflow uses. Nothing here reads the persisted
      # credential or checks out a fork head, so the jump is behaviour-neutral.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # The four on the LAST line are what C7e waited on.
          # GMPI_Wrappers/wrapper/VST3/CMakeLists.txt:256-264 runs six
          # pkg_check_modules(... REQUIRED) probes -- x11+xext, fontconfig,
          # freetype2, harfbuzz, libpng, dbus-1 -- and REQUIRED fails FAST, so
          # the log only ever named `xext` while harfbuzz and dbus-1 waited
          # behind it. The set was measured by restoring one .pc at a time on a
          # real Ubuntu box until configure returned 0, not read off the log:
          # docs/ci/linux-build-deps.md.
          #
          # libpng is in the probe list and passes today only because the
          # runner image happens to ship it -- declared here so it is one image
          # bump away from nothing rather than from a red build.
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxcb1-dev libgl1-mesa-dev libfreetype-dev \
            libfontconfig1-dev libasound2-dev \
            libxext-dev libharfbuzz-dev libdbus-1-dev libpng-dev

      # --- ccache (S30) -----------------------------------------------------
      #
      # macOS spends ~54 minutes of a ~60-minute job compiling, and 56% of those
      # compiles come from FETCHED DEPENDENCIES -- syntheditlib-src, gmpi_ui-src
      # and friends -- which change far less often than TIDE's own code. Those
      # are the objects a compiler cache is for.
      #
      # macOS and Linux only. ccache's MSVC support is not in the same state, and
      # Windows builds in 10 minutes, so it is not where the problem is.
      #
      # HOW MUCH THIS ACTUALLY SAVES IS NOT YET KNOWN. 56% is a share of compile
      # COUNT, not of wall-clock, and dependency objects are not necessarily the
      # slow ones. That is why the summary step below prints `ccache -s`: the
      # next few runs measure the answer instead of anyone estimating it.
      - name: Install ccache
        if: matrix.name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "macos" ]; then
            brew list ccache >/dev/null 2>&1 || brew install ccache
          else
            sudo apt-get install -y ccache
          fi
          # One cache path on both platforms, so the cache key below does not
          # have to branch and the restore cannot silently miss.
          ccache --set-config cache_dir="$HOME/.ccache"
          ccache --set-config max_size=2G
          # Dependency sources are fetched fresh each run into a path containing
          # the build dir, so absolute paths differ between runs and would defeat
          # every hash. Hashing content instead of paths is what makes this work.
          ccache --set-config hash_dir=false
          ccache --zero-stats

      # restore-keys matters more than the exact key here: TIDE's own sources
      # change every run, so an exact-key hit is rare and a PREFIX hit -- last
      # run's cache, warm for the dependencies -- is the normal case.
      - name: Restore ccache
        # Skipped on the self-hosted M1: ~/.ccache there is a real directory that
        # survives between jobs, so this step would download a copy of a cache the
        # machine already holds and upload it again at Post -- pure cost. On
        # GitHub-hosted runners it is still the only thing making ccache work at
        # all, so the condition is `github-hosted`, not a label test.
        if: matrix.name != 'windows' && runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: Configure
        id: configure
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ matrix.name }}" != "windows" ]; then
            # OBJCXX as well as C/CXX: the mac build compiles .mm sources, and
            # leaving them uncached would exempt exactly the Cocoa layer.
            extra="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      # `--parallel` WITH NO NUMBER IS NOT "one job per core". It is `make -j`
      # with no limit at all -- this repo configures with the default generator,
      # so that is GNU make starting a job for every ready target at once. On
      # macOS, the runner image with the least RAM of the three, that is the
      # difference between compiling and paging.
      #
      # Measured on an 8-core/8 GB M1, same tree, cold ccache, idle machine
      # between each, identical 536 compiles:
      #
      #   --parallel      23m26s   user 28m36s   sys 56m41s   swap grew to 5 GB
      #   --parallel 4     2m37s   user  8m41s   sys  1m13s   swap stable
      #   --parallel 6     1m59s   user  9m58s   sys  1m22s   swap stable
      #   --parallel 8     1m51s   user 11m14s   sys  1m32s   swap stable
      #
      # NOTE WHAT THAT DOES AND DOES NOT SAY. The core count is not the problem
      # -- -j8, one job per core, is the FASTEST row. Unbounded is the problem,
      # and the sys column is where it shows: 56 minutes of CPU spent in the
      # kernel rather than in the compiler. Sampled mid-run, that build had a
      # dozen compilers at 0% CPU and 0 MB resident, every one blocked on the
      # pager, load average 65 on 8 cores. Any finite number beats it by an
      # order of magnitude; 4 vs 8 is noise beside that.
      #
      # So do not "fix" a slow build here by lowering the number, and do not drop
      # the number to get the cores back -- dropping it is what costs 20 minutes.
      #
      # WHY THIS MAY MATTER MORE THAN THE GREEN RUNS SUGGEST: today the Build
      # step takes ~23s because ccache hits almost everything, so there is
      # nothing to run in parallel and the bug cannot show itself. It bites on a
      # COLD cache -- a dependency bump, a runner image roll, an evicted cache.
      # That is the shape S30 recorded above: pre-ccache, macOS took ~60 minutes
      # against linux 5 and windows 10 on the same 495 objects. This has not been
      # proven to be that cause, but it is a better fit than the runner being 5x
      # slower at arithmetic, and it is two lines to rule out.
      #
      # CMAKE_BUILD_PARALLEL_LEVEL cannot do this from the outside: an explicit
      # `--parallel` beats the environment variable and still yields bare `-j`
      # (verified 2026-08-23). The number has to be passed right here. BUILD_JOBS
      # is the override for any machine that wants to pick its own; nothing sets
      # it today, so all three platforms use their own core count.
      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          jobs="${BUILD_JOBS:-}"
          if [ -z "$jobs" ]; then
            jobs=$(sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo 4)
          fi
          echo "::notice::Building with -j${jobs}"
          cmake --build build --config Release --parallel "$jobs"

      # --- M6: the rack-content gate ------------------------------------
      #
      # `auval` is not a sufficient shipping gate and M5 proved it the expensive
      # way: for two days TIDE's AUv3 returned AU VALIDATION SUCCEEDED while
      # having no control pins, an empty module browser and no MIDI jacks.
      # `auval` validates the AU *interface* and never asks whether the plugin
      # CONTAINS anything, so a resource-resolution failure that empties the
      # whole rack is invisible to it.
      #
      # This asserts POSITIVES -- the four "enriched N of M" lines, "9 rack
      # prefab(s) seeded", "root MIDI-CV seeded". A grep-for-bad-lines gate
      # would NOT catch it, because seedPrefabsFromBundle() returns silently
      # when the resource folder is empty (BACKLOG M8).
      #
      # MACOS ONLY, and the reason is not squeamishness. The script LAUNCHES the
      # standalone and reads its stderr; the GitHub linux runner is headless, so
      # a GUI binary there could fail for a reason that has nothing to do with
      # rack content -- a gate that cries wolf is worse than no gate. Widening
      # to linux/windows wants someone to verify headless startup first.
      #
      # Deliberately NOT continue-on-error. This file already carries the lesson
      # (see "File a platform issue on failure" below): a swallowed failure made
      # that step decorative for weeks while every run reported success.
      - name: Rack content gate (M6)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bin="build/SynthEditSem/TIDE-Rack.app/Contents/MacOS/TIDE-Rack"
          if [ ! -x "$bin" ]; then
            echo "::error::standalone not found at $bin -- the rack-content gate cannot run"
            exit 1
          fi
          python3 scripts/check-rack-populated.py --standalone "$bin"

      # BACKLOG E62 -- THE DELETE KEY ACTUALLY DELETES, not merely bound.
      #
      # E57's Accept asked for "--type \x7f removes it from the document" to run
      # unattended. `e57_delete_key_probe.py` in the lint workflow is the
      # STRUCTURAL half -- it proves the binding exists and is unconditional, but
      # never presses a key, so it would pass on a build where DeleteSelection()
      # is wired correctly and declines. This is the behavioural half.
      #
      # MACOS ONLY, for the same reason as the gate above: it launches the GUI
      # standalone. The linux runner is headless and a failure there could mean
      # anything.
      #
      # The probe distinguishes its own failures from the app's -- a click that
      # selects nothing exits 2, not 1 -- so a red step here means the delete key
      # is broken, not that the harness slipped. Demonstrated 2026-08-28 against
      # a build predating SynthEditLib#68: document unchanged at 17954 bytes, 0
      # pixels moved, verdict NOT DELETED. Against the fixed build: 17960 ->
      # 14614 bytes and the panel gone.
      - name: Delete key deletes (E62)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bin="build/SynthEditSem/TIDE-Rack.app/Contents/MacOS/TIDE-Rack"
          if [ ! -x "$bin" ]; then
            echo "::error::standalone not found at $bin -- the E62 gate cannot run"
            exit 1
          fi
          python3 tests/e62_delete_key_behaviour_probe.py --standalone "$bin"

      # BACKLOG E51 -- the divert chain, guarded. -quiet must parse, prompts
      # must route through the chokepoint to stderr AND the kept list, and
      # --dialogs must drain that list over the command channel. The probe's
      # control (an argv-dropping wrapper) replays the exact regression
      # GMPI_Wrappers#29 fixed, so red here means the chain broke, not the
      # harness. macOS only, same reason as the two gates above.
      - name: Dialog divert chain (E51)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bin="build/SynthEditSem/TIDE-Rack.app/Contents/MacOS/TIDE-Rack"
          if [ ! -x "$bin" ]; then
            echo "::error::standalone not found at $bin -- the E51 gate cannot run"
            exit 1
          fi
          python3 tests/e51_dialog_divert_probe.py --standalone "$bin"

      # Always, including on a failed build -- a cache that is not being hit is
      # the thing worth seeing, and a red run is when you most want to know.
      - name: ccache statistics
        if: always() && matrix.name != 'windows'
        shell: bash
        run: ccache -s

      # A failing build on mac or linux is only useful if the machine that owns
      # that platform finds out about it. See docs/agent-setup.md, which calls
      # this "the mechanism the whole arrangement exists for".
      #
      # It had never once executed. From the day it was written until
      # 2026-08-09 the job's GITHUB_TOKEN was read-only, so `gh issue create`
      # returned 403; the job-level continue-on-error then in force swallowed
      # that, the run
      # reported success, and zero issues were ever filed — while every weekly
      # run's STEP 1 dutifully polled a feed that could not fill. Verified
      # before fixing: `gh issue list --state all` was empty and the workflow
      # permission was `read`. Assert on the signal, not the exit code.
      - name: File a platform issue on failure
        if: failure() && matrix.platform != 'win' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_NAME: ${{ matrix.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Backstop. Since 2026-08-16 the `guard` job gates the whole matrix on
          # this same condition, so reaching here with no root CMakeLists.txt
          # should be impossible. Kept anyway: it is two lines, and it is what
          # stops the issue-filing floodgate reopening silently if the guard is
          # ever removed without this being reconsidered.
          #
          # The check is the file itself rather than a log string: when C7 adds
          # a root CMakeLists.txt the suppression lifts by itself, with nobody
          # having to remember to remove it. A grep for the cmake error message
          # would need maintaining and would break on a cmake wording change.
          if [ ! -f CMakeLists.txt ]; then
            echo "::notice::No root CMakeLists.txt — this is the known pre-C7 failure (BACKLOG C7), not filing an issue."
            exit 0
          fi

          TITLE="Build failure on ${PLATFORM_NAME} — ${BRANCH}"

          # One issue per branch+platform. Without this, every push to a branch
          # that is still broken files another duplicate, and STEP 1's feed
          # becomes noise the owning machine learns to skim past.
          EXISTING=$(gh issue list \
            --state open \
            --label "platform:${PLATFORM}" \
            --limit 100 \
            --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Open issue #${EXISTING} already covers this branch+platform — commenting instead of duplicating."
            gh issue comment "$EXISTING" --body "$(printf '%s\n' \
              "Still failing as of \`${GITHUB_SHA}\`." \
              "" \
              "Run: ${RUN_URL}")"
          else
            gh issue create \
              --title "$TITLE" \
              --label "platform:${PLATFORM}" \
              --body "$(printf '%s\n' \
                "Branch: \`${BRANCH}\`" \
                "Commit: \`${GITHUB_SHA}\`" \
                "Run: ${RUN_URL}" \
                "" \
                "The ${PLATFORM_NAME} machine's next weekly run should pick this up" \
                "before taking a backlog item (STEP 1). Full compiler output is in" \
                "the run log." \
                "" \
                "Close this only after verifying the fix by building on that" \
                "platform; otherwise leave it open and say what remains.")"
          fi

      # ...and the other half, which is the one that was missing. BACKLOG S41.
      #
      # The step above files an issue keyed on branch+platform. Nothing closed
      # it. A break that fixes itself therefore leaves a live STEP 1 item — and
      # STEP 1 outranks every backlog row on every box — so a transient costs
      # three machines a session each, long after the build is green again.
      #
      # MEASURED, on this repo's own issue history:
      #
      #   #310  filed 2026-08-22T08:04:14Z, macos, main
      #         the run that filed it started 08:02:56Z and WAS the newest run
      #         for main at that moment; main went green at 09:08:46Z, 64 min
      #         later, with no fix in between (two sibling repos merged 26 s
      #         apart, so CI fetched the consumer without the provider)
      #   31 issues filed on 2026-08-20 alone, all linux, one per branch,
      #         closed in a single manual sweep the next day
      #   #306  still open, for a branch that no longer exists
      #
      # WHY THIS AND NOT S41's OPTION (a). That option was "re-check the
      # branch's latest run before filing". It would have filed #310 anyway:
      # the failing run was the latest run. There is no following run to
      # consult at filing time, which is exactly what S41's own Accept asks
      # about — "no issue ONCE THE FOLLOWING RUN IS GREEN". That is this step.
      #
      # WHAT THIS COSTS, stated rather than discovered later: the filing step
      # de-duplicates on OPEN issues only, so a branch that flaps red/green/red
      # now files a SECOND issue where it used to add a comment to the first.
      # That is the right trade — each red is a real occurrence, and one issue
      # per occurrence is cheaper than one issue that outlives its cause — but
      # it is a change in behaviour for an intermittently failing branch.
      #
      # A green run is evidence about THIS commit, not proof the reported
      # defect is gone: a race's normal outcome is success (see #314). So this
      # closes with the evidence written into the comment, and closing is
      # reversible by anyone who thinks it was wrong.
      #
      # Only issues this mechanism could have filed are touched: exact title
      # match, the platform label, and a bot author. `is_bot` rather than a
      # login string because the login `gh` renders for an app has changed
      # form before; a hand-filed issue from a person or from tide-rack-bot is
      # never auto-closed, which is what keeps #314's class safe.
      - name: Close the platform issue on success
        if: success() && matrix.platform != 'win' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_NAME: ${{ matrix.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TITLE="Build failure on ${PLATFORM_NAME} — ${BRANCH}"

          EXISTING=$(gh issue list \
            --state open \
            --label "platform:${PLATFORM}" \
            --limit 100 \
            --json number,title,author \
            | jq -r --arg t "$TITLE" \
              '[.[] | select(.title == $t and .author.is_bot)] | .[0].number // empty')

          if [ -z "$EXISTING" ]; then
            echo "No open CI-filed issue for ${PLATFORM_NAME} + ${BRANCH} — nothing to close."
            exit 0
          fi

          echo "::notice::${PLATFORM_NAME} is green on ${BRANCH} — closing #${EXISTING}."
          gh issue comment "$EXISTING" --body "$(printf '%s\n' \
            "Green on \`${PLATFORM_NAME}\` as of \`${GITHUB_SHA}\`, so closing this automatically (BACKLOG S41)." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "**This is evidence about that commit, not proof the reported defect is gone.**" \
            "A race's normal outcome is success, so if this issue described something" \
            "intermittent, reopen it — a green run is exactly what the broken code" \
            "produces most of the time.")"
          gh issue close "$EXISTING" --reason completed

  # ---------------------------------------------------------------------------
  # The path tracer's image-regression test, on all three platforms.
  #
  # UNTIL NOW NOTHING RAN IT. `tide_render_regression` appeared in no workflow,
  # and TideSynth's root force-disables TIDE_RENDER_PREVIEW (CMakeLists.txt),
  # so no CI and no ordinary build has ever executed it. S27 spent two sessions
  # on cross-platform render divergence that only a human building a second
  # architecture by hand could see; this is what makes it visible.
  #
  # Independent of `guard` and `build` on purpose: modules/common is a
  # dependency-free CMake project, so it needs neither a root CMakeLists nor the
  # SDK fetches, and it should keep reporting when those are broken.
  #
  # fail-fast: false so one platform going red still lets the other two report --
  # with a divergence question, the platforms that PASS are half the answer.
  #
  # EXPECT THE FIRST RUN TO BE INFORMATIVE RATHER THAN GREEN. The references are
  # baked on macOS arm64. Whether Windows and Linux match them has never been
  # measured, which is precisely why this job exists; a red Windows or Linux here
  # is a MEASUREMENT, not a broken build, and the row it feeds (S27) already
  # lists the three ways to resolve it.
  render:
    name: render-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure and build the path tracer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S modules/common -B build-render -DCMAKE_BUILD_TYPE=Release
          cmake --build build-render --config Release -j

      - name: Image regression
        shell: bash
        run: |
          set -euo pipefail
          # Multi-config generators (Windows) put the binary in a config
          # subdirectory; single-config ones do not. Find it rather than guess.
          # No -perm test: on the Windows runner the executable bit is not
          # meaningful, and the binary is tide_render_regression.exe there.
          exe=$(find build-render -type f \( -name 'tide_render_regression' -o -name 'tide_render_regression.exe' \) | head -1)
          if [ -z "$exe" ]; then
            echo "::error::tide_render_regression was not built"
            exit 1
          fi
          echo "==> $exe"
          mkdir -p "$GITHUB_WORKSPACE/render-failures"
          cd modules/common
          "$GITHUB_WORKSPACE/$exe" tests/references "$GITHUB_WORKSPACE/render-failures"

      # The -actual images are the only way to tell "the maths moved by a bit"
      # from "a light went out", and the log cannot show that.
      - name: Upload the rendered images when they differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-actual-${{ matrix.name }}
          path: render-failures/
          if-no-files-found: ignore
