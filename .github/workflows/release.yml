# BACKLOG R5 -- tag v* -> build, sign and publish one GitHub Release.
#
# TRIGGERS ON TAGS ONLY. Never on pull_request, and never on a branch push.
# That is the whole security design: a fork PR cannot run this workflow, so it
# cannot reach the signing credentials, and no `pull_request_target` shortcut
# exists here to undo that.
#
# The credentials live in the `release` ENVIRONMENT, not in repo secrets --
# repo-level secrets are empty by design (verified 2026-08-22). That
# environment carries `required_reviewers: JeffMcClintock`, so every job below
# that names it PAUSES for a human approval before a secret is decrypted. A
# stolen tag push therefore still cannot sign anything.
#
# Asset names carry NO version (docs/distribution.md): the version lives in the
# tag, so `releases/latest/download/TIDE-Rack-macOS.pkg` is a permalink R6 can
# promise never to change.
name: release

on:
  push:
    tags:
      - 'v*'

# Least privilege: the publish job needs to create a release, nothing else needs
# write at all.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false     # never cancel a half-signed release

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Gates on Jeff's approval AND is where the credentials live. Both halves
    # matter: without this line the steps below get empty secrets and would
    # silently publish unsigned artifacts.
    environment: release
    strategy:
      fail-fast: false          # one platform failing must not hide the others
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # THE TAG NEVER REACHED THE PACKAGERS. All three read TIDE_RACK_VERSION
      # and nothing ever set it: package-macos.sh fell back to a hardcoded
      # 0.1.0, package-windows.ps1 got an EMPTY version, and the Linux tarball
      # carried none at all -- while the bundles themselves said 1.0.0, GMPI's
      # default for a <Plugin> tag with no version attribute. Four consumers,
      # four different answers, none of them the tag.
      #
      # A shell step rather than a job-level env: because the leading "v" has to
      # come off, and GitHub's expression syntax has no substring function --
      # format/startsWith/contains cannot do it. shell: bash so the one script
      # works on the Windows runner too.
      - name: Derive the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not derive a version from ref '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "TIDE_RACK_VERSION=$version" >> "$GITHUB_ENV"
          echo "==> TIDE_RACK_VERSION=$version (from tag $GITHUB_REF_NAME)"

      # Same list build.yml installs, kept deliberately identical -- a release
      # that builds against a different dependency set from CI is a release
      # nothing has actually tested.
      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxcb1-dev libgl1-mesa-dev libfreetype-dev \
            libfontconfig1-dev libasound2-dev \
            libxext-dev libharfbuzz-dev libdbus-1-dev libpng-dev

      # ORDER IS DELIBERATE: credentials are checked BEFORE the build, not after.
      #
      # This step used to sit after Build. Both of v0.1.0's failed attempts were
      # credential problems -- a missing Developer ID Installer certificate, then
      # a passphrase that did not match the archive -- and each was discovered
      # only after ~60 minutes of compiling on a macOS runner. Roughly two hours
      # spent to learn something knowable in thirty seconds.
      #
      # Nothing here depends on the build, and the keychain is created with a
      # 6-hour timeout, so it comfortably outlives the compile that follows.
      # --- macOS: import the Developer ID cert into a throwaway keychain -----
      #
      # A temporary keychain rather than the login one: it is deleted with the
      # runner, and it cannot prompt. The password is per-run and never leaves
      # the job.
      - name: Import signing certificate (macOS)
        if: matrix.name == 'macos'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Secrets set through the GitHub WEB UI can carry a trailing newline
          # or space that the CLI would never add, and PKCS#12 treats one extra
          # byte in the passphrase as a wrong password. v0.1.0 lost a run to
          # exactly that: "SecKeychainItemImport: MAC verification failed during
          # PKCS12 import (wrong password?)" after the secret was set in the
          # browser. Strip whitespace from both rather than make the operator
          # guess which field is subtly wrong.
          APPLE_CERT_P12_BASE64="$(printf '%s' "$APPLE_CERT_P12_BASE64" | tr -d '[:space:]')"
          APPLE_CERT_PASSWORD="$(printf '%s' "$APPLE_CERT_PASSWORD" | tr -d '[:cntrl:]')"

          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Report the SHAPE of the decoded file without revealing it. A
          # truncated or mis-pasted base64 shows up here as an implausible size
          # or a failed integrity check, which distinguishes "bad certificate
          # data" from "bad passphrase" -- the two produce similar-looking
          # import failures and need completely different fixes.
          p12_bytes=$(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ')
          echo "==> decoded PKCS#12 is ${p12_bytes} bytes"
          if [ "$p12_bytes" -lt 1000 ]; then
            echo "::error::The decoded certificate is only ${p12_bytes} bytes, which is too small to be a"
            echo "::error::PKCS#12 containing a private key. APPLE_CERT_P12_BASE64 is probably truncated"
            echo "::error::or not base64. This is a CERTIFICATE DATA problem, not a passphrase one."
            exit 1
          fi
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin pass:"$APPLE_CERT_PASSWORD" -legacy >/dev/null 2>&1; then
            echo "::error::The passphrase in APPLE_CERT_PASSWORD does not open APPLE_CERT_P12_BASE64."
            echo "::error::The file decoded to a plausible ${p12_bytes} bytes, so the CERTIFICATE is fine"
            echo "::error::and the PASSPHRASE is wrong -- they must come from the SAME export. Note a"
            echo "::error::secret set through the web UI can carry a trailing newline; this step already"
            echo "::error::strips whitespace, so a failure here means the values genuinely disagree."
            exit 1
          fi
          echo "==> passphrase opens the archive"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "==> identities now available to this job:"
          security find-identity -v -p codesigning "$KEYCHAIN"


      # --- ccache (S30) -----------------------------------------------------
      #
      # Added 2026-08-22, after v0.1.0's first run: build.yml got ccache and this
      # file did not, so a RELEASE always paid the full ~60 minutes on macOS --
      # the one place the wait is felt, because someone is waiting on a tag.
      #
      # THE KEY PREFIX IS DELIBERATELY THE SAME AS build.yml's. A tag run can
      # read caches created on the default branch, so a release starts warm from
      # whatever main last compiled instead of from nothing. That only works
      # while the prefix matches; change one and change both.
      #
      # Using a cache for a SIGNED, SHIPPED artifact is a deliberate choice, not
      # an oversight. ccache keys on the preprocessed source, the compiler and
      # the flags, so a hit is a byte-identical object -- the same guarantee an
      # incremental local build relies on. If that assumption is ever in doubt,
      # deleting the cache entry (or bumping this prefix) forces a cold build.
      - name: Install ccache
        if: matrix.name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "macos" ]; then
            brew list ccache >/dev/null 2>&1 || brew install ccache
          else
            sudo apt-get install -y ccache
          fi
          ccache --set-config cache_dir="$HOME/.ccache"
          ccache --set-config max_size=2G
          # Dependencies are re-fetched into a build-dir-relative path each run,
          # so absolute paths differ and would defeat every hash.
          ccache --set-config hash_dir=false
          ccache --zero-stats

      - name: Restore ccache
        if: matrix.name != 'windows'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ matrix.name }}" != "windows" ]; then
            # OBJCXX too, or the .mm Cocoa layer -- the mac-specific half -- is
            # the one part that stays uncached.
            extra="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      # `--parallel` with no number is `make -j` with NO LIMIT here -- this job
      # configures with the default generator, so on mac and linux that is GNU
      # make starting a job for every ready target. Measured on an 8-core/8 GB
      # M1: unbounded 23m26s (sys 56m41s, paging) against 1m51s at -j8. The core
      # count is not the problem, unbounded is. See build.yml's Build step for
      # the full table and the reasoning.
      #
      # This file matters more than build.yml for the same bug: it builds what
      # actually ships.
      #
      # CMAKE_BUILD_PARALLEL_LEVEL cannot fix it from outside -- an explicit
      # `--parallel` beats the env var and still yields bare `-j`.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          jobs="${BUILD_JOBS:-}"
          if [ -z "$jobs" ]; then
            jobs=$(sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo 4)
          fi
          echo "::notice::Building with -j${jobs}"
          cmake --build build --config Release --parallel "$jobs"

      # Always, including on failure: a release that took an hour because the
      # cache missed is worth knowing about, and a red run is when you ask.
      - name: ccache statistics
        if: always() && matrix.name != 'windows'
        shell: bash
        run: ccache -s

      - name: Package (macOS)
        if: matrix.name == 'macos'
        env:
          # NOTE, if signing ever fails with "ambiguous (matches N identities)":
          # codesign matches on the certificate's common name, and Jeff's
          # machine holds TWO valid, identically-named "Developer ID
          # Application: SynthEdit Limited (36SNPLRFK3)" certs (SHA-1
          # E112A740..., issued 2026-03-26, and CEFB950D..., issued 2026-08-08;
          # both expire 2027-02-01). Whether that bites here depends on how many
          # of them APPLE_CERT_P12_BASE64 contains. If it bites, set
          # APPLE_SIGNING_IDENTITY to the SHA-1 hash instead of the name --
          # codesign accepts a hash and a hash cannot be ambiguous.
          APPLE_CERTIFICATE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          # A DIFFERENT CERTIFICATE from the "Developer ID Application" one in
          # APPLE_SIGNING_IDENTITY: productbuild signs the .pkg with an
          # *Installer* cert, and a pkg without one cannot be notarized or
          # installed. Provisioned in the release environment 2026-08-22 as
          # "Developer ID Installer: SynthEdit Limited (36SNPLRFK3)".
          #
          # The guard below stays anyway. It costs nothing, and the failure it
          # prevents -- a payload-signed pkg that looks fine until a user tries
          # to open it -- is exactly the kind that reaches people rather than CI.
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_INSTALLER_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_INSTALLER_SIGNING_IDENTITY is not set in the 'release' environment."
            echo "::error::productbuild needs a 'Developer ID Installer' certificate, which is a"
            echo "::error::different certificate from the 'Developer ID Application' one in"
            echo "::error::APPLE_SIGNING_IDENTITY. Without it the .pkg cannot be notarized or"
            echo "::error::installed. See BACKLOG R5."
            exit 1
          fi
          scripts/package-macos.sh build "$GITHUB_WORKSPACE/dist"

      # Notarization is R5's own clause and cannot be done in package-macos.sh,
      # which has no credentials by design.
      - name: Notarize and staple (macOS)
        if: matrix.name == 'macos'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/dist/TIDE-Rack-macOS.pkg"

          # AN APP STORE CONNECT API KEY, not an Apple ID plus app-specific
          # password. The password was a long-lived credential tied to a person;
          # the key is scoped, revocable on its own, and is what notarytool
          # actually prefers. BACKLOG R7(2), Apple half.
          #
          # Decoded to a private temp file because notarytool takes a PATH, not
          # the key material. umask first so the file is never briefly readable,
          # and a trap so it does not outlive the step even if notarisation dies.
          KEYDIR="$(mktemp -d)"
          trap 'rm -rf "$KEYDIR"' EXIT
          umask 077
          KEY="$KEYDIR/AuthKey_${APPLE_API_KEY_ID}.p8"

          # Whitespace stripped before decoding: the web UI can carry a trailing
          # newline the CLI never would, and base64 is unforgiving about it --
          # the same trap R5 hit on APPLE_CERT_PASSWORD.
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY"

          # Check the secret BEFORE spending an hour proving it wrong. A .p8 is a
          # PEM private key; if it did not decode to one, say so now.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            echo "::error::APPLE_API_KEY_P8_BASE64 did not decode to a PEM private key" \
                 "($(wc -c < "$KEY" | tr -d ' ') bytes). Re-set it with:" \
                 "gh secret set APPLE_API_KEY_P8_BASE64 --env release < <(base64 -i AuthKey_XXX.p8)"
            exit 1
          fi
          echo "==> App Store Connect key ${APPLE_API_KEY_ID} decoded ($(wc -c < "$KEY" | tr -d ' ') bytes)"

          # RETRY APPLE'S SERVER, NEVER APPLE'S VERDICT. v0.1.0 died here on
          # "HTTP status code: 500. Internal Server Error / Please try again at
          # a later time" -- Apple's notary service, not us. Everything before
          # it had succeeded, so a whole release run was lost to a server that
          # asked to be retried.
          #
          # A REJECTION IS NOT A TRANSIENT FAILURE and retrying one would waste
          # an hour re-uploading a package Apple has already examined and said
          # no to, while burying the reason. So a verdict of Invalid exits
          # immediately -- and prints WHY, which this step never used to do.
          attempts=4
          delay=60
          n=1
          while : ; do
            echo "==> notarytool submit (attempt $n of $attempts; waits for Apple's verdict)"
            set +e
            out=$(xcrun notarytool submit "$PKG" \
              --key "$KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"

            # Some notarytool versions exit 0 even when the verdict is Invalid,
            # so the verdict is checked separately from the exit code.
            if [ $rc -eq 0 ] && ! printf '%s' "$out" | grep -q "status: Invalid"; then
              break
            fi

            if printf '%s' "$out" | grep -q "status: Invalid"; then
              echo "==> Apple examined the package and REJECTED it. Not retrying."
              id=$(printf '%s' "$out" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
              if [ -n "$id" ]; then
                echo "==> reasons (notarytool log $id):"
                xcrun notarytool log "$id" \
                  --key "$KEY" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER_ID" || true
              fi
              exit 1
            fi

            if ! printf '%s' "$out" | grep -qE "HTTP status code: 5[0-9][0-9]|Please try again|connection was lost|timed out|Could not connect|Unable to (find|connect)"; then
              echo "==> not a transient server failure; not retrying."
              exit $rc
            fi

            if [ $n -ge $attempts ]; then
              echo "==> Apple's notary service still failing after $attempts attempts."
              exit $rc
            fi

            echo "==> transient server failure; retrying in ${delay}s"
            sleep "$delay"
            n=$((n + 1))
            delay=$((delay * 2))
          done
          echo "==> staple"
          xcrun stapler staple "$PKG"
          echo "==> verify the staple survived, rather than trusting the exit code"
          xcrun stapler validate "$PKG"
          spctl --assess --type install -vv "$PKG"

      # --- Windows: Azure Trusted Signing, in TWO passes -------------------
      #
      # ORDER MATTERS AND IS EASY TO GET WRONG. docs/distribution.md requires
      # the installer AND the .vst3 inside it to be signed. The packager COPIES
      # the built DLL into the bundle, the zip and the installer, so signing
      # after packaging would leave three unsigned copies inside signed
      # containers -- which looks signed to a casual check and is not.
      #
      # So: sign the built DLL, THEN package, THEN sign the installer.
      - name: Sign the VST3 (Windows)
        if: matrix.name == 'windows'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CODESIGN_PROFILE }}
          files-folder: ${{ github.workspace }}/build
          files-folder-filter: vst3
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -BuildDir build -OutDir "$env:GITHUB_WORKSPACE/dist" -Version "${{ github.ref_name }}"

      - name: Sign the installer (Windows)
        if: matrix.name == 'windows'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CODESIGN_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The zip is built from the same signed DLL, so it needs no signature of
      # its own -- a .zip cannot carry an Authenticode signature anyway.
      - name: Verify the Windows signatures took
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/TIDE-Rack-Windows.exe'
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "  installer: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer signature is $($sig.Status)" }

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: scripts/package-linux.sh build "$GITHUB_WORKSPACE/dist"

      # Assert the asset this platform owes actually exists, by NAME. A packaging
      # script that silently produced nothing would otherwise reach `publish` as
      # a missing asset in a released tag.
      - name: Verify the expected asset exists
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          case "${{ matrix.name }}" in
            windows) expected="TIDE-Rack-Windows.exe TIDE-Rack-Windows.zip" ;;
            macos)   expected="TIDE-Rack-macOS.pkg" ;;
            linux)   expected="TIDE-Rack-Linux.tar.gz" ;;
          esac
          for f in $expected; do
            [ -s "$f" ] || { echo "::error::missing or empty asset: $f"; exit 1; }
            echo "  ok $f ($(wc -c < "$f") bytes)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write           # the one job that needs it
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets and checksum them
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec mv -n {} dist/ \;
          cd dist
          # Sorted so the file is byte-stable for a given set of assets, which
          # makes two releases diffable.
          sha256sum $(ls | sort) > SHA256SUMS.txt
          echo "==> release assets:"
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "TIDE Rack ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
