# Deploys website/ to GitHub Pages (tidesynth.com).
#
# This workflow does nothing until Pages is enabled for the repo:
#   Settings -> Pages -> Source: "GitHub Actions"   (a Jeff step -- see
#   docs/hosting.md for the full go-live checklist, including DNS).
# Until then, configure-pages fails with "Get Pages site failed" -- that error
# means "Pages not enabled yet", not that this file is broken.
#
# The site is one static file with no build step, so this is upload + deploy
# and nothing else. If website/ ever grows a build step, it goes between
# checkout and upload.

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/

      - id: deployment
        uses: actions/deploy-pages@v4
